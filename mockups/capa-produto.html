<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Capa do Produto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#1a0f11;}
  .cover{
    position:relative;width:1080px;height:1350px;
    background:
      radial-gradient(ellipse 900px 700px at 50% 92%, rgba(122,46,59,0.55) 0%, transparent 60%),
      linear-gradient(165deg, #170d0e 0%, #34141a 45%, #1c0f11 100%);
    overflow:hidden;
    font-family:'Manrope',sans-serif;
  }

  /* elementos decorativos flutuantes (substituem os "dolares" da referencia
     por algo do universo do produto: petalas/folhas suaves) */
  .petal{position:absolute;border-radius:50% 0 50% 50%;opacity:.22;filter:blur(1px);}
  .p1{width:70px;height:70px;background:#c9a86a;top:120px;left:90px;transform:rotate(35deg);}
  .p2{width:46px;height:46px;background:#7c8b6f;top:230px;right:120px;transform:rotate(-20deg);}
  .p3{width:90px;height:90px;background:#7a2e3b;top:60px;right:280px;transform:rotate(70deg);opacity:.16;}
  .p4{width:34px;height:34px;background:#c9a86a;top:340px;left:220px;transform:rotate(-45deg);opacity:.18;}
  .sparkle{position:absolute;border-radius:50%;background:#f0e4d3;filter:blur(.5px);}
  .s1{width:6px;height:6px;top:180px;left:200px;opacity:.7;}
  .s2{width:4px;height:4px;top:400px;right:180px;opacity:.6;}
  .s3{width:5px;height:5px;top:90px;right:400px;opacity:.55;}
  .s4{width:4px;height:4px;top:480px;left:130px;opacity:.5;}

  .eyebrow-wrap{position:absolute;top:86px;left:0;right:0;display:flex;justify-content:center;z-index:5;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    border:1.5px solid rgba(240,228,211,0.55);border-radius:99px;
    padding:10px 26px;color:#f0e4d3;font-size:20px;font-weight:800;
    letter-spacing:.22em;text-transform:uppercase;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:6px;height:6px;background:#c9a86a;border-radius:50%;}

  .photo-wrap{
    position:absolute;left:50%;top:210px;transform:translateX(-50%);
    width:920px;height:780px;z-index:2;
  }
  .photo-wrap img{
    width:100%;height:100%;object-fit:cover;object-position:50% 22%;
    -webkit-mask-image:
      linear-gradient(to bottom, black 45%, transparent 92%),
      linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
    -webkit-mask-composite:source-in;
            mask-image:
      linear-gradient(to bottom, black 45%, transparent 92%),
      linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
            mask-composite:intersect;
  }

  .badge-duration{
    position:absolute;top:940px;left:50%;transform:translateX(-50%);z-index:6;
    background:linear-gradient(90deg,#7a2e3b,#5e2029);color:#fdf7ee;
    font-weight:800;font-size:23px;letter-spacing:.08em;white-space:nowrap;
    padding:15px 38px;border-radius:99px;box-shadow:0 10px 30px rgba(122,46,59,0.5);
    border:1.5px solid rgba(240,228,211,0.3);
  }

  .title-wrap{
    position:absolute;left:0;right:0;bottom:96px;z-index:5;text-align:center;padding:0 50px;
  }
  .title{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:92px;line-height:.98;
    letter-spacing:-.01em;text-transform:uppercase;
    background:linear-gradient(180deg,#fdf7ee 0%,#f0e4d3 35%,#c9a86a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 8px 40px rgba(0,0,0,0.5);
    text-wrap:balance;
  }
  .subtitle{
    margin-top:20px;font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    font-size:30px;color:#f0e4d3;
  }

  .vignette{position:absolute;inset:0;z-index:3;
    background:linear-gradient(180deg, rgba(23,13,14,0) 52%, rgba(23,13,14,0.4) 78%, rgba(23,13,14,0.78) 100%);
    pointer-events:none;
  }
  .frame{position:absolute;inset:26px;border:1.5px solid rgba(240,228,211,0.18);z-index:7;pointer-events:none;}
</style>
</head>
<body>
<div class="cover">
  <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div>
  <div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div><div class="sparkle s4"></div>

  <div class="eyebrow-wrap"><div class="eyebrow">Desafio</div></div>

  <div class="photo-wrap">
    <img src="images/noiva-buque-sorrindo.jpg" alt="Noiva feliz">
  </div>

  <div class="vignette"></div>

  <div class="badge-duration">21 DIAS PARA O GRANDE DIA</div>

  <div class="title-wrap">
    <div class="title">Shape de<br>Noiva</div>
    <div class="subtitle">Cardápio · Treino · Mentalidade</div>
  </div>

  <div class="frame"></div>
</div>
</body>
</html>
