<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Capa do Produto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#1a0f11;}
  .cover{
    position:relative;width:1080px;height:1350px;
    background:
      radial-gradient(ellipse 900px 700px at 50% 92%, rgba(122,46,59,0.55) 0%, transparent 60%),
      linear-gradient(165deg, #170d0e 0%, #34141a 45%, #1c0f11 100%);
    overflow:hidden;
    font-family:'Manrope',sans-serif;
  }

  /* elementos decorativos flutuantes (substituem os "dolares" da referencia
     por algo do universo do produto: petalas/folhas suaves) */
  .petal{position:absolute;border-radius:50% 0 50% 50%;opacity:.22;filter:blur(1px);}
  .p1{width:70px;height:70px;background:#c9a86a;top:120px;left:90px;transform:rotate(35deg);}
  .p2{width:46px;height:46px;background:#7c8b6f;top:230px;right:120px;transform:rotate(-20deg);}
  .p3{width:90px;height:90px;background:#7a2e3b;top:60px;right:280px;transform:rotate(70deg);opacity:.16;}
  .p4{width:34px;height:34px;background:#c9a86a;top:340px;left:220px;transform:rotate(-45deg);opacity:.18;}
  .sparkle{position:absolute;border-radius:50%;background:#f0e4d3;filter:blur(.5px);}
  .s1{width:6px;height:6px;top:180px;left:200px;opacity:.7;}
  .s2{width:4px;height:4px;top:400px;right:180px;opacity:.6;}
  .s3{width:5px;height:5px;top:90px;right:400px;opacity:.55;}
  .s4{width:4px;height:4px;top:480px;left:130px;opacity:.5;}

  .eyebrow-wrap{position:absolute;top:86px;left:0;right:0;display:flex;justify-content:center;z-index:5;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    border:1.5px solid rgba(240,228,211,0.55);border-radius:99px;
    padding:10px 26px;color:#f0e4d3;font-size:20px;font-weight:800;
    letter-spacing:.22em;text-transform:uppercase;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:6px;height:6px;background:#c9a86a;border-radius:50%;}

  .photo-wrap{
    position:absolute;left:0;top:0;width:1080px;height:1080px;z-index:1;overflow:hidden;
  }
  .photo-wrap img{
    width:100%;height:100%;object-fit:cover;object-position:50% 30%;
    filter:grayscale(1) contrast(1.15) brightness(.9);
  }
  .duotone{
    position:absolute;inset:0;z-index:2;
    background:#7a2e3b;
    mix-blend-mode:color;
  }
  .duotone-multiply{
    position:absolute;inset:0;z-index:2;
    background:linear-gradient(180deg, rgba(23,13,14,0.42) 0%, rgba(23,13,14,0.5) 55%, rgba(23,13,14,0.97) 92%);
  }
  .photo-fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:420px;z-index:3;
    background:linear-gradient(180deg, transparent 0%, #170d0e 88%);
  }

  .badge-duration{
    position:absolute;top:678px;left:50%;transform:translateX(-50%);z-index:6;
    background:#fdf7ee;color:#5e2029;
    font-weight:800;font-size:22px;letter-spacing:.05em;white-space:nowrap;
    padding:13px 32px 11px;box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .badge-duration::before, .badge-duration::after{
    content:"";position:absolute;top:0;width:0;height:0;
    border-top:24px solid #fdf7ee;
  }
  .badge-duration::before{left:-20px;border-right:20px solid transparent;}
  .badge-duration::after{right:-20px;border-left:20px solid transparent;}

  .title-wrap{
    position:absolute;left:0;right:0;bottom:56px;z-index:5;text-align:center;padding:0 30px;
  }
  .title{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:96px;line-height:.94;
    letter-spacing:-.02em;text-transform:uppercase;color:#fdf7ee;
    text-wrap:balance;
  }
  .title .accent{
    background:linear-gradient(180deg,#f0d9a0 0%,#c9a86a 60%,#a8813f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:block;
  }
  .subtitle{
    margin-top:22px;font-family:'Manrope',sans-serif;font-weight:700;
    font-size:24px;letter-spacing:.04em;color:#e6d8c3;text-transform:uppercase;
  }
  .subtitle b{color:#c9a86a;}

  .vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(180deg, rgba(23,13,14,0.25) 0%, transparent 18%);
  }
  .frame{position:absolute;inset:26px;border:1.5px solid rgba(240,228,211,0.18);z-index:7;pointer-events:none;}
</style>
</head>
<body>
<div class="cover">
  <div class="photo-wrap">
    <img src="images/noiva-buque-sorrindo.jpg" alt="Noiva feliz">
  </div>
  <div class="duotone"></div>
  <div class="duotone-multiply"></div>
  <div class="photo-fade-bottom"></div>
  <div class="vignette"></div>

  <div class="badge-duration">21 DIAS PARA O GRANDE DIA</div>

  <div class="title-wrap">
    <div class="title">Desafio<br>Shape de<span class="accent">Noiva</span></div>
    <div class="subtitle">Método completo: <b>Cardápio · Treino · Mentalidade</b></div>
  </div>

  <div class="frame"></div>
</div>
</body>
</html>
