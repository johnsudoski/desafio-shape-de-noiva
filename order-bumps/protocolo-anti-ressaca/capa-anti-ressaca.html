<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Capa - Protocolo Anti-Ressaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#1a0f11;}
  .cover{
    position:relative;width:1080px;height:1350px;
    background:
      radial-gradient(ellipse 900px 700px at 50% 92%, rgba(122,46,59,0.55) 0%, transparent 60%),
      linear-gradient(165deg, #170d0e 0%, #34141a 45%, #1c0f11 100%);
    overflow:hidden;
    font-family:'Manrope',sans-serif;
  }
  .photo-wrap{position:absolute;left:0;top:0;width:1080px;height:1080px;z-index:1;overflow:hidden;}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(1) contrast(1.15) brightness(.9);}
  .duotone{position:absolute;inset:0;z-index:2;background:#7a2e3b;mix-blend-mode:color;}
  .duotone-multiply{position:absolute;inset:0;z-index:2;
    background:linear-gradient(180deg, rgba(23,13,14,0.42) 0%, rgba(23,13,14,0.5) 55%, rgba(23,13,14,0.97) 92%);}
  .photo-fade-bottom{position:absolute;left:0;right:0;bottom:0;height:460px;z-index:3;
    background:linear-gradient(180deg, transparent 0%, #170d0e 88%);}

  .badge-duration{
    position:absolute;top:610px;left:50%;transform:translateX(-50%);z-index:6;
    background:#fdf7ee;color:#5e2029;
    font-weight:800;font-size:22px;letter-spacing:.05em;white-space:nowrap;
    padding:13px 32px 11px;box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .badge-duration::before, .badge-duration::after{content:"";position:absolute;top:0;width:0;height:0;border-top:24px solid #fdf7ee;}
  .badge-duration::before{left:-20px;border-right:20px solid transparent;}
  .badge-duration::after{right:-20px;border-left:20px solid transparent;}

  .eyebrow-wrap{position:absolute;top:700px;left:0;right:0;display:flex;justify-content:center;z-index:5;}
  .eyebrow{color:#c9a86a;font-size:20px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;}

  .title-wrap{position:absolute;left:0;right:0;bottom:56px;z-index:5;text-align:center;padding:0 30px;}
  .title{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:82px;line-height:.98;
    letter-spacing:-.02em;text-transform:uppercase;color:#fdf7ee;text-wrap:balance;
  }
  .title .accent{
    background:linear-gradient(180deg,#f0d9a0 0%,#c9a86a 60%,#a8813f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;display:block;
  }
  .subtitle{margin-top:22px;font-weight:700;font-size:23px;letter-spacing:.04em;color:#e6d8c3;text-transform:uppercase;}
  .subtitle b{color:#c9a86a;}

  .vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(180deg, rgba(23,13,14,0.25) 0%, transparent 18%);}
  .frame{position:absolute;inset:26px;border:1.5px solid rgba(240,228,211,0.18);z-index:7;pointer-events:none;}
</style>
</head>
<body>
<div class="cover">
  <div class="photo-wrap"><img src="images/resultado-noiva-floresta.jpg" alt="Noiva feliz ao ar livre"></div>
  <div class="duotone"></div>
  <div class="duotone-multiply"></div>
  <div class="photo-fade-bottom"></div>
  <div class="vignette"></div>

  <div class="badge-duration">BÔNUS EXCLUSIVO</div>
  <div class="eyebrow-wrap"><div class="eyebrow">Recupere em 24h</div></div>

  <div class="title-wrap">
    <div class="title">Protocolo<br>Anti-<span class="accent">Ressaca</span></div>
    <div class="subtitle">Recuperação Pós-<b>Despedida de Solteira</b></div>
  </div>

  <div class="frame"></div>
</div>
</body>
</html>
